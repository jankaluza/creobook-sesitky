[page]
# A5 logical page size (ISO 216)
width_mm = 148.0
height_mm = 210.0

[margins]
# Mirrored for duplex: inner is binding edge.
# Outer/top/bottom leave room so home lasers do not clip header/footer
# (CreoBook label + page numbers) when printing imposed booklets.
inner_mm = 12.0
outer_mm = 11.0
top_mm = 18.0
bottom_mm = 16.0

[colors]
# High-contrast black & white for reliable laser printing.
# Avoid light grays — many lasers drop anything softer than ~40% black.
ink = "#000000"
muted = "#1a1a1a"
light = "#333333"
# Writing rules (linky / seznam / …): light-medium gray (test on your laser)
rule = "#9a9a9a"
accent = "#000000"
weekend = "#000000"
holiday = "#000000"
adjacent = "#444444"
background = "#ffffff"
fold_guide = "#666666"
header = "#000000"
# No pale fills (they often fail to print); templates use strokes instead
holiday_bg = "#ffffff"
weekend_bg = "#ffffff"

[fonts]
family = "Inter"
# Relative to project root
directory = "assets/fonts"

[lines]
# Slightly heavier strokes so thin rules survive toner / resolution limits
rule_width_mm = 0.35
grid_width_mm = 0.35
dot_diameter_mm = 0.65
margin_line_width_mm = 0.45
fold_guide_width_mm = 0.35
checkbox_size_mm = 3.5
checkbox_stroke_mm = 0.40

[defaults]
ruled_spacing_mm = 8.0
dotted_spacing_mm = 5.0
grid_spacing_mm = 5.0
checklist_rows = 16
header_height_mm = 6.0
footer_height_mm = 5.0
# Distance from inner edge for ruled vertical margin / Cornell cue column
margin_line_from_inner_mm = 28.0
cornell_cue_width_mm = 48.0
cornell_summary_height_mm = 28.0

[booklet]
# A4 landscape sheet for imposition
sheet_width_mm = 297.0
sheet_height_mm = 210.0
fold_guide = true

[brand]
name = "CreoBook"
tagline = "notebook inserts"
