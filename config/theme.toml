[page]
# A5 logical page size (ISO 216)
width_mm = 148.0
height_mm = 210.0

[margins]
# Mirrored for duplex: inner is binding edge
inner_mm = 13.0
outer_mm = 9.0
top_mm = 11.0
bottom_mm = 11.0

[colors]
# Grayscale-friendly palette; accent is configurable
ink = "#1a1a1a"
muted = "#6e6e6e"
light = "#b3b3b3"
rule = "#c4c4c4"
accent = "#555555"
weekend = "#4a4a4a"
holiday = "#2e2e2e"
adjacent = "#9a9a9a"
background = "#ffffff"
fold_guide = "#d4d4d4"
header = "#5a5a5a"
holiday_bg = "#ececec"
weekend_bg = "#f6f6f6"

[fonts]
family = "DejaVu Sans"
# Relative to project root
directory = "assets/fonts"

[lines]
rule_width_mm = 0.15
grid_width_mm = 0.12
dot_diameter_mm = 0.45
margin_line_width_mm = 0.25
fold_guide_width_mm = 0.12
checkbox_size_mm = 3.5
checkbox_stroke_mm = 0.25

[defaults]
ruled_spacing_mm = 7.0
dotted_spacing_mm = 5.0
grid_spacing_mm = 5.0
checklist_rows = 16
header_height_mm = 6.0
footer_height_mm = 5.0
# Distance from inner edge for ruled vertical margin / Cornell cue column
margin_line_from_inner_mm = 28.0
cornell_cue_width_mm = 48.0
cornell_summary_height_mm = 28.0

[booklet]
# A4 landscape sheet for imposition
sheet_width_mm = 297.0
sheet_height_mm = 210.0
fold_guide = true

[brand]
name = "CreoBook"
tagline = "notebook inserts"
