name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install package and deps
        run: uv sync --all-extras

      - name: Show pinned Typst version
        run: uv run creobook version

      - name: Install Poppler (preview smoke)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Run tests
        run: uv run pytest -q

      - name: Generate sample PDFs
        run: |
          uv run creobook page ruled --spacing 7
          uv run creobook calendar --year 2026
          uv run creobook booklet output/pages/calendar-2026.pdf

      - name: Preview smoke
        run: uv run creobook preview output/pages/calendar-2026.pdf --dpi 36

      - name: Upload sample artefacts
        uses: actions/upload-artifact@v4
        with:
          name: creobook-samples
          path: |
            output/pages/*.pdf
            output/booklet/*.pdf
            output/preview/
